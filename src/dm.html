<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Magehand — DM</title>
<style>
  :root {
    --bg:#14131a; --panel:#1e1c26; --edge:#2c2a38; --ink:#ece9f5; --dim:#8a8699;
    --rules:#5aa9ff; --fact:#c9a24a; --trigger:#e0603a; --secret:#b07bff; --whisper:#4ac48f;
    --overdue:#e0603a;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    background:var(--bg); color:var(--ink);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    display:flex; flex-direction:column; height:100dvh;
  }
  #party { padding:8px 12px; border-bottom:1px solid var(--edge); display:flex;
    flex-wrap:wrap; gap:8px; align-items:center; }
  .pc { background:var(--panel); border:1px solid var(--edge); border-radius:10px;
    padding:6px 12px; font-size:14px; line-height:1.5; }
  .pc b { font-size:15px; }
  .pc .hp { font-variant-numeric:tabular-nums; font-weight:650; }
  .pc .hp.hurt { color:var(--fact); }
  .pc .hp.down { color:var(--trigger); }
  .pc .meta { color:var(--dim); font-size:12px; }
  .pc .cond { color:var(--trigger); font-size:12px; }
  #pins { padding:8px 12px; border-bottom:1px solid var(--edge); display:flex;
    flex-wrap:wrap; gap:6px; align-items:center; min-height:44px; }
  #pins .lbl { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.04em; margin-right:4px; }
  .chip { background:var(--panel); border:1px solid var(--edge); border-radius:999px;
    padding:4px 11px; font-size:14px; color:var(--dim); }
  .chip.overdue { border-color:var(--overdue); color:var(--overdue); font-weight:600; }
  #feed { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:12px; }
  /* not `.chip` — renderThreads() clears every .chip in the pins bar */
  #maptoggle { margin-left:auto; cursor:pointer; background:var(--panel); border:1px solid var(--edge);
    border-radius:999px; padding:4px 11px; font-size:14px; color:var(--dim); min-height:0; }
  #maptoggle.on { color:var(--rules); border-color:var(--rules); }
  #mapview { flex:1; overflow:auto; padding:12px; }
  #mapctl { display:flex; gap:8px; margin-bottom:10px; align-items:center; flex-wrap:wrap; }
  #mapctl input[type=file] { color:var(--dim); font-size:13px; }
  #mapwrap { position:relative; touch-action:none; max-width:1200px; }
  #mapimg { max-width:100%; display:block; border-radius:10px; }
  .tok { position:absolute; transform:translate(-50%,-50%); width:36px; height:36px; border-radius:50%;
    background:#1e1c26cc; border:2px solid var(--rules); color:var(--ink); font-size:11px; font-weight:650;
    display:grid; place-items:center; user-select:none; touch-action:none; cursor:grab; }
  .tok.pc { border-color:#f5d76e; }
  #mapempty { color:var(--dim); text-align:center; margin-top:40px; }
  .hidden { display:none !important; }
  #empty { color:var(--dim); text-align:center; margin:auto; font-size:15px; }
  .card { background:var(--panel); border:1px solid var(--edge); border-left:5px solid var(--edge);
    border-radius:10px; padding:12px 14px; animation:in .18s ease; }
  @keyframes in { from{opacity:0; transform:translateY(-6px);} to{opacity:1;} }
  .card.faded { opacity:.4; }
  .card.rules   { border-left-color:var(--rules); }
  .card.fact    { border-left-color:var(--fact); }
  .card.trigger { border-left-color:var(--trigger); }
  .card.secret  { border-left-color:var(--secret); }
  .card.whisper { border-left-color:var(--whisper); }
  .whisper .tag { color:var(--whisper); }
  .acts .rin { flex:1; min-width:140px; font:inherit; font-size:15px; background:#26232f;
    border:1px solid var(--edge); color:var(--ink); border-radius:8px; padding:9px 12px; }
  .card .top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .tag { font-size:11px; text-transform:uppercase; letter-spacing:.05em; font-weight:700; }
  .rules .tag{color:var(--rules);} .fact .tag{color:var(--fact);}
  .trigger .tag{color:var(--trigger);} .secret .tag{color:var(--secret);}
  .ts { color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
  .headline { font-size:21px; font-weight:650; margin:4px 0 2px; }
  .quote { color:var(--dim); font-style:italic; font-size:14px; margin:2px 0; }
  .body { white-space:pre-wrap; margin:6px 0 2px; }
  .ref { color:var(--dim); font-size:13px; }
  .acts { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  button { font:inherit; font-size:15px; border:1px solid var(--edge); background:#26232f;
    color:var(--ink); border-radius:8px; padding:9px 15px; min-height:44px; cursor:pointer; }
  button:active { transform:translateY(1px); }
  button.primary { background:#2f3b52; border-color:var(--rules); }
  button.ghost { color:var(--dim); }
  #ribbon { border-top:1px solid var(--edge); padding:8px 12px; color:var(--dim);
    font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-height:36px; }
  #ribbon b { color:var(--dim); font-weight:600; text-transform:uppercase; font-size:11px; letter-spacing:.04em; margin-right:8px; }
  #dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#3a7; margin-right:6px; }
  #dot.stale { background:var(--overdue); }
  #toast { position:fixed; bottom:56px; left:50%; transform:translateX(-50%);
    background:#2f3b52; border:1px solid var(--rules); border-radius:8px; padding:10px 16px;
    opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
  <div id="party"></div>
  <div id="pins"><span class="lbl"><span id="dot"></span>threads</span>
    <button id="maptoggle">Map</button></div>
  <div id="mapview" class="hidden">
    <div id="mapctl">
      <input type="file" id="mapfile" accept="image/png,image/jpeg,image/webp">
      <button id="tokadd">Add token</button>
      <span class="ts">drag to move · double-tap to remove · players move only their own</span>
    </div>
    <div id="mapwrap" class="hidden"><img id="mapimg" alt="battle map"><div id="maptokens"></div></div>
    <p id="mapempty">No map yet — upload an image.</p>
  </div>
  <div id="feed"><div id="empty">Waiting for the listener… run <code>magehand listen</code> in another terminal.</div></div>
  <div id="ribbon"><b>heard</b><span id="rib">—</span></div>
  <div id="toast"></div>
<script>
const feed = document.getElementById('feed');
const pins = document.getElementById('pins');
const rib  = document.getElementById('rib');
const dot  = document.getElementById('dot');
const toast= document.getElementById('toast');
const cards = new Map();   // id -> element
let toastTimer;

function esc(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }
function showToast(m){ toast.textContent=m; toast.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.classList.remove('show'),2600); }

function render(c){
  if(cards.has(c.id)) return;
  document.getElementById('empty')?.remove();
  const sig = c.signal||'?';
  const el = document.createElement('div');
  el.className = 'card '+sig;
  el.dataset.born = Date.now();
  let acts = '<button class="ghost" data-a="dismiss">Dismiss</button>';
  if(sig==='rules') acts = '<button class="primary" data-a="ruling">Save ruling</button>'+acts;
  else if(sig==='whisper') acts = '<input class="rin" placeholder="reply privately…">'+
    '<button class="primary" data-a="reply">Reply</button>'+acts;
  else acts = '<button data-a="thread">Open thread</button>'+acts;
  el.innerHTML =
    `<div class="top"><span class="tag">${esc(sig)}</span><span class="ts">${esc(c.ts||'')}</span></div>`+
    `<div class="headline">${esc(c.headline||'')}</div>`+
    (c.quote?`<div class="quote">“${esc(c.quote)}”</div>`:'')+
    (c.body?`<div class="body">${esc(c.body)}</div>`:'')+
    (c.ref?`<div class="ref">ref: ${esc(c.ref)}</div>`:'')+
    `<div class="acts">${acts}</div>`;
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>act(c.id, b.dataset.a, el));
  feed.prepend(el);
  cards.set(c.id, el);
}

function dismiss(id){
  const el = cards.get(id);
  if(el){ el.remove(); cards.delete(id); }
  if(!cards.size && !document.getElementById('empty')){
    feed.innerHTML = '<div id="empty">No open cards.</div>';
  }
}

async function act(id, a, el){
  const body = {action:a, id};
  if(a==='reply'){
    const t = el?.querySelector('.rin')?.value.trim();
    if(!t) return;
    body.text = t;
  }
  try{
    const r = await fetch('action',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)});
    const j = await r.json();
    showToast(j.msg || (j.ok?'done':'failed'));
    if(j.ok) dismiss(id);          // server also broadcasts a dismiss; this is instant feedback
  }catch(e){ showToast('action failed'); }
}

function renderThreads(list){
  pins.querySelectorAll('.chip').forEach(c=>c.remove());
  if(!list.length){ const s=document.createElement('span'); s.className='chip'; s.textContent='none open'; pins.append(s); return; }
  for(const t of list){
    const s=document.createElement('span');
    s.className='chip'+(t.overdue?' overdue':'');
    s.textContent = (t.overdue?'⏰ ':'') + t.title;
    pins.append(s);
  }
}

function renderParty(list){
  const party = document.getElementById('party');
  party.innerHTML = '';
  for(const p of list){
    const cur=+p.cur_hp||0, max=+p.max_hp||0, tmp=+p.temp_hp||0;
    const hpClass = cur<=0?'down':(max&&cur<=max/2?'hurt':'');
    const el=document.createElement('div'); el.className='pc';
    el.innerHTML =
      `<b>${esc(p.name)}</b> <span class="hp ${hpClass}">${cur}${tmp?'+'+tmp:''}/${max}</span>`+
      `<div class="meta">AC ${esc(p.ac||'?')} · PP ${esc(p.passive_perception||'?')}`+
      (+p.inspiration?' · ✦':'')+`</div>`+
      (p.conditions?`<div class="cond">${esc(p.conditions)}</div>`:'')+
      (cur<=0?`<div class="cond">death: ${'●'.repeat(+p.death_success||0)}${'○'.repeat(3-(+p.death_success||0))} / ${'✖'.repeat(+p.death_fail||0)}</div>`:'');
    party.append(el);
  }
}

// ---- map ----
const mapToggle = document.getElementById('maptoggle');
mapToggle.onclick = ()=>{
  const on = document.getElementById('mapview').classList.toggle('hidden');
  document.getElementById('feed').classList.toggle('hidden', !on);
  mapToggle.classList.toggle('on', !on);
};
let mapV = null;
function initials(s){ return s.split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase(); }
async function mapPost(body){
  try{
    const r = await fetch('map/token',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)});
    const j = await r.json();
    if(!j.ok) showToast(j.msg||'map action failed');
  }catch(e){ showToast('map action failed'); }
}
function renderMap(m){
  const has = !!m.image;
  document.getElementById('mapwrap').classList.toggle('hidden', !has);
  document.getElementById('mapempty').classList.toggle('hidden', has);
  if(!has) return;
  if(m.v !== mapV){ mapV = m.v; document.getElementById('mapimg').src = 'map/image?v='+m.v; }
  const wrap = document.getElementById('maptokens');
  wrap.innerHTML = '';
  for(const t of m.tokens||[]){
    const el = document.createElement('div');
    el.className = 'tok'+(t.owner?' pc':'');
    el.style.left = (t.x*100)+'%'; el.style.top = (t.y*100)+'%';
    el.textContent = initials(t.label||'?'); el.title = t.label+(t.owner?' ('+t.owner+')':'');
    el.ondblclick = ()=>{ if(confirm('Remove '+t.label+'?')) mapPost({op:'remove', id:t.id}); };
    el.onpointerdown = e=>{
      e.preventDefault(); el.setPointerCapture(e.pointerId);
      const rect = document.getElementById('mapimg').getBoundingClientRect();
      const at = ev=>({ x: Math.min(1,Math.max(0,(ev.clientX-rect.left)/rect.width)),
                        y: Math.min(1,Math.max(0,(ev.clientY-rect.top)/rect.height)) });
      el.onpointermove = ev=>{ const p=at(ev); el.style.left=(p.x*100)+'%'; el.style.top=(p.y*100)+'%'; };
      el.onpointerup = ev=>{
        el.onpointermove = el.onpointerup = null;
        const p = at(ev);
        mapPost({op:'move', id:t.id, x:p.x, y:p.y});
      };
    };
    wrap.append(el);
  }
}
document.getElementById('mapfile').onchange = async e=>{
  const f = e.target.files[0]; if(!f) return;
  try{
    const r = await fetch('map/image',{method:'POST',headers:{'Content-Type':f.type},body:f});
    const j = await r.json();
    showToast(j.msg||(j.ok?'uploaded':'upload failed'));
  }catch(_){ showToast('upload failed'); }
  e.target.value = '';
};
document.getElementById('tokadd').onclick = ()=>{
  const label = prompt('Token label (e.g. Mira, Goblin 1):'); if(!label) return;
  const owner = prompt('Owner slug — lets that player move it (blank = DM only):')||'';
  mapPost({op:'add', label, owner: owner.trim()});
};

// auto-fade cards older than 5 min so the feed never rots
setInterval(()=>{
  const now=Date.now();
  for(const el of cards.values())
    el.classList.toggle('faded', now - (+el.dataset.born) > 300000);
}, 15000);

const ev = new EventSource('events');
ev.addEventListener('card',      e=>render(JSON.parse(e.data)));
ev.addEventListener('dismiss',   e=>dismiss(JSON.parse(e.data).id));
ev.addEventListener('threads',   e=>renderThreads(JSON.parse(e.data)));
ev.addEventListener('party',     e=>renderParty(JSON.parse(e.data)));
ev.addEventListener('map',       e=>renderMap(JSON.parse(e.data)));
ev.addEventListener('transcript',e=>{ rib.textContent = JSON.parse(e.data).text || '—'; });
ev.onopen  = ()=>dot.classList.remove('stale');
ev.onerror = ()=>dot.classList.add('stale');
</script>
</body>
</html>
