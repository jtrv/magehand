<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Magehand</title>
<style>
  :root { --bg:#14131a; --panel:#1e1c26; --edge:#2c2a38; --ink:#ece9f5; --dim:#8a8699; --accent:#5aa9ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    display:flex; flex-direction:column; height:100dvh; }
  header { padding:12px 16px calc(12px + env(safe-area-inset-top)); border-bottom:1px solid var(--edge);
    font-weight:650; font-size:18px; }
  header small { color:var(--dim); font-weight:400; font-size:13px; display:block; }
  main { flex:1; overflow-y:auto; padding:14px 16px 20px; }
  #voicebar { display:flex; gap:8px; align-items:center; padding:8px 16px;
    border-bottom:1px solid var(--edge); }
  #voicebar button { background:var(--panel); border:1px solid var(--edge); border-radius:999px;
    color:var(--dim); font:inherit; font-size:13px; padding:7px 13px; }
  #voicebar button:disabled { opacity:.5; }
  #voicebar button.on { color:var(--ink); border-color:var(--accent); background:#2f3b52; }
  #voicecount { color:var(--dim); font-size:13px; }
  .hidden { display:none; }
  /* sheet */
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .fld { background:var(--panel); border:1px solid var(--edge); border-radius:10px; padding:8px 10px; }
  .fld .k { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.03em; }
  .num { display:flex; align-items:center; gap:8px; margin-top:4px; }
  .num .v { flex:1; text-align:center; font-size:26px; font-weight:650; font-variant-numeric:tabular-nums; }
  .num button { width:44px; height:44px; font-size:22px; border:1px solid var(--edge); background:#26232f;
    color:var(--ink); border-radius:9px; }
  .fld input { width:100%; margin-top:4px; background:#26232f; border:1px solid var(--edge); color:var(--ink);
    border-radius:8px; padding:9px; font:inherit; }
  .body { margin-top:16px; white-space:pre-wrap; color:var(--dim); font-size:14px; }
  .empty { color:var(--dim); text-align:center; margin-top:40px; }
  .hero { background:var(--panel); border:1px solid var(--edge); border-radius:12px;
    padding:12px; margin-bottom:10px; }
  .hero .num .v { font-size:40px; }
  .hero .sub { display:flex; justify-content:space-between; color:var(--dim); font-size:13px; margin-top:6px; }
  .hero .sub button { background:none; border:none; color:var(--dim); font:inherit; padding:4px 8px; }
  .dots { display:flex; gap:14px; align-items:center; margin-top:10px; font-size:13px; color:var(--dim); }
  .dots button { width:34px; height:34px; border-radius:50%; border:1px solid var(--edge);
    background:#26232f; color:var(--ink); font-size:16px; }
  .dots button.on.s { background:#2c5240; border-color:#4ac48f; }
  .dots button.on.f { background:#54302a; border-color:#e0603a; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 14px; }
  .chips button { background:var(--panel); border:1px solid var(--edge); border-radius:999px;
    color:var(--dim); font:inherit; font-size:13px; padding:7px 13px; }
  .chips button.on { color:var(--ink); border-color:#e0603a; background:#54302a; }
  .insp { background:none; border:1px solid var(--edge); border-radius:10px; color:var(--dim);
    font:inherit; padding:8px 14px; }
  .insp.on { color:#f5d76e; border-color:#f5d76e; }
  /* map */
  #mapwrap { position:relative; touch-action:none; }
  #mapimg { max-width:100%; display:block; border-radius:10px; }
  .tok { position:absolute; transform:translate(-50%,-50%); width:36px; height:36px; border-radius:50%;
    background:#1e1c26cc; border:2px solid var(--accent); color:var(--ink); font-size:11px; font-weight:650;
    display:grid; place-items:center; user-select:none; touch-action:none; }
  .tok.own { border-color:#f5d76e; box-shadow:0 0 0 2px #f5d76e44; }
  /* ask */
  #log { display:flex; flex-direction:column; gap:12px; margin-bottom:14px; }
  .q { align-self:flex-end; background:#2f3b52; border-radius:12px 12px 3px 12px; padding:9px 13px; max-width:85%; }
  .a { align-self:flex-start; background:var(--panel); border:1px solid var(--edge);
    border-radius:12px 12px 12px 3px; padding:11px 13px; max-width:92%; white-space:pre-wrap; }
  .a .foot { color:var(--dim); font-size:12px; margin-top:8px; border-top:1px solid var(--edge); padding-top:6px; }
  #askbar, #mbar { position:sticky; bottom:0; display:flex; gap:8px; padding-top:6px; background:var(--bg); }
  #askbar input, #mbar input { flex:1; background:#26232f; border:1px solid var(--edge); color:var(--ink);
    border-radius:10px; padding:12px; font:inherit; }
  #askbar button, #mbar button { border:1px solid var(--accent); background:#2f3b52; color:var(--ink);
    border-radius:10px; padding:0 18px; font:inherit; }
  #mlog { display:flex; flex-direction:column; gap:12px; margin-bottom:14px; }
  .mts { color:var(--dim); font-size:11px; margin-top:3px; }
  /* stuff */
  .stuff h3 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--dim); margin:18px 0 8px; }
  .note { background:var(--panel); border:1px solid var(--edge); border-radius:10px; padding:11px 13px;
    margin-bottom:8px; white-space:pre-wrap; }
  .secret { border-left:4px solid #b07bff; }
  /* tabs */
  nav { display:flex; border-top:1px solid var(--edge); padding-bottom:env(safe-area-inset-bottom); }
  nav button { flex:1; background:none; border:none; color:var(--dim); font:inherit; font-size:13px;
    padding:12px 0 14px; }
  nav button.on { color:var(--accent); }
  #toast { position:fixed; bottom:70px; left:50%; transform:translateX(-50%); background:#2f3b52;
    border:1px solid var(--accent); border-radius:8px; padding:9px 15px; opacity:0; transition:opacity .2s; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
  <header id="hdr">…<small>your character</small></header>
  <div id="voicebar">
    <button id="voicejoin" disabled>Join voice</button>
    <button id="voicemute" class="hidden">Mute</button>
    <span id="voicecount"></span>
  </div>
  <main>
    <section id="sheet"></section>
    <section id="ask" class="hidden">
      <div id="log"></div>
      <div id="askbar"><input id="qbox" placeholder="rules or lore question…" enterkeyhint="send">
        <button id="qsend">Ask</button></div>
    </section>
    <section id="dm" class="hidden">
      <div id="mlog"></div>
      <div id="mbar"><input id="mbox" placeholder="whisper to your DM…" enterkeyhint="send">
        <button id="msend">Send</button></div>
    </section>
    <section id="map" class="hidden">
      <div id="mapwrap" class="hidden"><img id="mapimg" alt="battle map"><div id="maptokens"></div></div>
      <p id="mapempty" class="empty">No map yet — your DM hasn’t shared one.</p>
    </section>
    <section id="stuff" class="hidden" class="stuff"></section>
  </main>
  <nav>
    <button data-t="sheet" class="on">Sheet</button>
    <button data-t="ask">Ask</button>
    <button data-t="dm">DM</button>
    <button data-t="map">Map</button>
    <button data-t="stuff">Stuff</button>
  </nav>
  <div id="toast"></div>
<script src="voice.js"></script>
<script>
const $ = s => document.querySelector(s);
function esc(s){ const d=document.createElement('div'); d.textContent=s??''; return d.innerHTML; }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

// tabs
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on', x===b));
  for(const id of ['sheet','ask','dm','map','stuff']) $('#'+id).classList.toggle('hidden', id!==b.dataset.t);
  if(b.dataset.t==='ask') $('#qbox').focus();
  if(b.dataset.t==='dm') $('#mbox').focus();
});

let data = null;
async function load(){
  try{
    const r = await fetch('data');
    if(!r.ok) throw new Error();
    data = await r.json();
    $('#hdr').innerHTML = esc(data.name)+'<small>your character</small>';
    renderSheet(); renderStuff(); renderMsgs();
    $('#voicejoin').disabled = false;
    if(lastMap) renderMap(lastMap); // the map SSE event can beat this fetch; re-run for own-token highlight
  }catch(e){
    $('#hdr').textContent = "couldn't load";
    $('#sheet').classList.remove('hidden');
    $('#sheet').innerHTML = '<p class="empty">Couldn’t load — <button id="retry">retry</button></p>';
    $('#retry').onclick = load;
  }
}

const CONDITIONS = ['blinded','charmed','frightened','grappled','invisible','paralyzed',
  'poisoned','prone','restrained','stunned','concentrating'];
const SPECIAL = ['cur_hp','max_hp','temp_hp','death_success','death_fail','inspiration','conditions'];

function renderSheet(){
  const el = $('#sheet');
  if(!data.has_sheet){
    el.innerHTML = '<p class="empty">No sheet yet.<br>Ask your DM to run<br><code>magehand sheet new '+esc(data.name)+'</code></p>';
    return;
  }
  const f = Object.fromEntries(data.fields.map(x=>[x.key,x.value]));
  const cur=+f.cur_hp||0, max=+f.max_hp||0, tmp=+f.temp_hp||0;
  const active = (f.conditions||'').split(',').map(s=>s.trim()).filter(Boolean);
  let h = '';
  // HP hero: the number that changes every round gets the big tap targets.
  // Each block only renders if its field exists — hand-written sheets may
  // predate the template keys, and set_field rejects unknown ones anyway.
  if('cur_hp' in f){
    h += `<div class="hero"><div class="k">hit points</div><div class="num">`+
      `<button data-k="cur_hp" data-d="-1">−</button>`+
      `<span class="v" id="v-cur_hp">${cur}</span>`+
      `<button data-k="cur_hp" data-d="1">+</button></div>`+
      `<div class="sub"><span>of ${max}</span>`+
      ('temp_hp' in f ? `<span>temp <button data-k="temp_hp" data-d="-1">−</button>`+
        `<span id="v-temp_hp">${tmp}</span> <button data-k="temp_hp" data-d="1">+</button></span>` : '')+
      ('inspiration' in f ? `<button class="insp${+f.inspiration?' on':''}" id="insp">✦ inspiration</button>` : '')+
      `</div>`;
    if('death_success' in f && (cur<=0 || +f.death_success || +f.death_fail)){
      h += `<div class="dots">saves `+
        [1,2,3].map(n=>`<button class="s${+f.death_success>=n?' on':''}" data-ds="death_success" data-n="${n}">●</button>`).join('')+
        ` fails `+
        [1,2,3].map(n=>`<button class="f${+f.death_fail>=n?' on':''}" data-ds="death_fail" data-n="${n}">✖</button>`).join('')+
        `</div>`;
    }
    h += `</div>`;
  }
  if('conditions' in f){
    h += '<div class="chips">'+CONDITIONS.map(c=>
      `<button data-c="${c}"${active.includes(c)?' class="on"':''}>${c}</button>`).join('')+'</div>';
  }
  h += '<div class="grid">';
  for(const fl of data.fields){
    if(SPECIAL.includes(fl.key)) continue;
    if(fl.numeric){
      h += `<div class="fld"><div class="k">${esc(fl.key)}</div><div class="num">`+
        `<button data-k="${esc(fl.key)}" data-d="-1">−</button>`+
        `<span class="v" id="v-${esc(fl.key)}">${esc(fl.value)}</span>`+
        `<button data-k="${esc(fl.key)}" data-d="1">+</button></div></div>`;
    } else {
      h += `<div class="fld" style="grid-column:1/-1"><div class="k">${esc(fl.key)}</div>`+
        `<input data-k="${esc(fl.key)}" value="${esc(fl.value)}"></div>`;
    }
  }
  h += '</div>';
  if(data.body) h += `<div class="body">${esc(data.body)}</div>`;
  el.innerHTML = h;
  el.querySelectorAll('button[data-k]').forEach(b=>b.onclick=async()=>{
    const span = $('#v-'+CSS.escape(b.dataset.k));
    const next = (parseInt(span.textContent||'0',10)||0) + (+b.dataset.d);
    b.disabled = true;
    const saved = await save(b.dataset.k, String(next));
    if(saved !== null){ span.textContent = saved; setLocal(b.dataset.k, saved); }
    b.disabled = false;
    if(b.dataset.k==='cur_hp') renderSheet();   // crossing 0 shows/hides death saves
  });
  el.querySelectorAll('button[data-ds]').forEach(b=>b.onclick=async()=>{
    const k=b.dataset.ds, n=+b.dataset.n;
    const next = (+getLocal(k)||0)===n ? n-1 : n;  // tap topmost filled dot to undo it
    const saved = await save(k, String(next));
    if(saved !== null){ setLocal(k, saved); renderSheet(); }
  });
  const insp = $('#insp');
  if(insp) insp.onclick = async()=>{
    const saved = await save('inspiration', +getLocal('inspiration') ? '0' : '1');
    if(saved !== null){ setLocal('inspiration', saved); renderSheet(); }
  };
  el.querySelectorAll('.chips button').forEach(b=>b.onclick=async()=>{
    const c=b.dataset.c;
    const list=(getLocal('conditions')||'').split(',').map(s=>s.trim()).filter(Boolean);
    const next=(list.includes(c)?list.filter(x=>x!==c):[...list,c]).join(', ');
    const saved = await save('conditions', next);
    if(saved !== null){ setLocal('conditions', saved); renderSheet(); }
  });
  el.querySelectorAll('input').forEach(i=>{
    i.dataset.saved = i.value;
    i.onchange=async()=>{
      const value = i.value;
      i.value = i.dataset.saved;
      i.disabled = true;
      const saved = await save(i.dataset.k, value);
      if(saved !== null) i.value = i.dataset.saved = saved;
      i.disabled = false;
    };
  });
}

function getLocal(k){ return (data.fields.find(f=>f.key===k)||{}).value; }
function setLocal(k,v){ const f=data.fields.find(x=>x.key===k); if(f) f.value=v; }

async function save(key, value){
  try{
    const r = await fetch('sheet',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({key,value})});
    const j = await r.json();
    if(!j.ok){ toast(j.msg||'save failed'); return null; }
    return String(j.value);
  }catch(e){ toast('offline?'); return null; }
}

function renderStuff(){
  let h = '';
  if(data.recap){ h += '<h3>Previously…</h3><div class="note">'+esc(data.recap)+'</div>'; }
  h += '<h3>Just for you</h3>';
  if(data.secrets && data.secrets.length)
    h += data.secrets.map(s=>'<div class="note secret">'+esc(s)+'</div>').join('');
  else h += '<div class="note" style="color:var(--dim)">Nothing yet.</div>';
  $('#stuff').innerHTML = h;
}

// ask
async function ask(){
  const box = $('#qbox'); const q = box.value.trim(); if(q.length<3) return;
  box.value=''; const log=$('#log');
  log.insertAdjacentHTML('beforeend', `<div class="q">${esc(q)}</div>`);
  const a = document.createElement('div'); a.className='a'; a.textContent='…'; log.appendChild(a);
  a.scrollIntoView();
  try{
    const r = await fetch('ask',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({q})});
    const j = await r.json();
    a.innerHTML = esc(j.answer) + '<div class="foot">Ask your DM to be sure — this isn’t a ruling.</div>';
  }catch(e){ a.textContent='offline?'; }
  a.scrollIntoView();
}
$('#qsend').onclick = ask;
$('#qbox').addEventListener('keydown', e=>{ if(e.key==='Enter') ask(); });

// direct line to the DM
function msgBubble(m){
  const own = m.from !== 'dm';
  return `<div class="${own?'q':'a'}">${esc(m.text)}<div class="mts">${own?'you':'DM'} · ${esc(m.ts||'')}</div></div>`;
}
function renderMsgs(){
  $('#mlog').innerHTML = (data.messages||[]).map(msgBubble).join('');
}
async function sendMsg(){
  const box = $('#mbox'); const text = box.value.trim(); if(!text) return;
  box.value='';
  $('#mlog').insertAdjacentHTML('beforeend', msgBubble({from:'me', text, ts:''}));
  try{
    const r = await fetch('msg',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text})});
    const j = await r.json();
    if(!j.ok) toast(j.msg||'send failed');
  }catch(e){ toast('offline?'); }
}
$('#msend').onclick = sendMsg;
$('#mbox').addEventListener('keydown', e=>{ if(e.key==='Enter') sendMsg(); });

// map: render server state; drag commits on release (fractions of image size)
let mapV = null, lastMap = null;
function initials(s){ return s.split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase(); }
function renderMap(m){
  lastMap = m;
  const has = !!m.image;
  $('#mapwrap').classList.toggle('hidden', !has);
  $('#mapempty').classList.toggle('hidden', has);
  if(!has) return;
  if(m.v !== mapV){ mapV = m.v; $('#mapimg').src = 'map-image?v='+m.v; }
  const wrap = $('#maptokens');
  wrap.innerHTML = '';
  for(const t of m.tokens||[]){
    const el = document.createElement('div');
    el.className = 'tok'+(data && t.owner===data.slug?' own':'');
    el.style.left = (t.x*100)+'%'; el.style.top = (t.y*100)+'%';
    el.textContent = initials(t.label||'?'); el.title = t.label;
    if(data && t.owner===data.slug) dragOwn(el, t.id);
    wrap.append(el);
  }
}
function dragOwn(el, id){
  el.onpointerdown = e=>{
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    const rect = $('#mapimg').getBoundingClientRect();
    const at = ev=>({ x: Math.min(1,Math.max(0,(ev.clientX-rect.left)/rect.width)),
                      y: Math.min(1,Math.max(0,(ev.clientY-rect.top)/rect.height)) });
    el.onpointermove = ev=>{ const p=at(ev); el.style.left=(p.x*100)+'%'; el.style.top=(p.y*100)+'%'; };
    el.onpointerup = async ev=>{
      el.onpointermove = el.onpointerup = null;
      const p = at(ev);
      try{
        const r = await fetch('token',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({id, x:p.x, y:p.y})});
        const j = await r.json();
        if(!j.ok) toast(j.msg||'move failed');
      }catch(_){ toast('offline?'); }
    };
  };
}

// live push: DM replies + map updates (voice signaling rides this stream in a later phase)
const ev = new EventSource('events');
ev.addEventListener('dm', e=>{
  const m = JSON.parse(e.data);
  $('#mlog').insertAdjacentHTML('beforeend', msgBubble({from:'dm', ...m}));
  if($('#dm').classList.contains('hidden')) toast('DM replied');
});
ev.addEventListener('map', e=>renderMap(JSON.parse(e.data)));

// voice
const vjoin = $('#voicejoin'), vmute = $('#voicemute'), vcount = $('#voicecount');
let vjoined = false, vmuted = false;
function voicePeers(list){
  vcount.textContent = vjoined ? (list.length+1)+' in voice' : '';
}
vjoin.onclick = async ()=>{
  if(!vjoined){
    vjoin.disabled = true;
    try{
      await Voice.join(data.slug, ev, voicePeers);
      vjoined = true;
      vjoin.textContent = 'Leave'; vjoin.classList.add('on');
      vmute.classList.remove('hidden');
      voicePeers([]);
    }catch(e){ toast('mic unavailable'); }
    vjoin.disabled = false;
  }else{
    Voice.leave();
    vjoined = false; vmuted = false;
    vjoin.textContent = 'Join voice'; vjoin.classList.remove('on');
    vmute.textContent = 'Mute'; vmute.classList.remove('on'); vmute.classList.add('hidden');
    vcount.textContent = '';
  }
};
vmute.onclick = ()=>{
  vmuted = !vmuted;
  Voice.selfMute(vmuted);
  vmute.textContent = vmuted ? 'Unmute' : 'Mute';
  vmute.classList.toggle('on', vmuted);
};

load();
</script>
</body>
</html>
