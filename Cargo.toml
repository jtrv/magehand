[package]
name = "magehand"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local RAG assistant for tabletop RPG game masters: answers rules questions from your own books and tracks campaign state in a plain-markdown vault."
repository = "https://github.com/jtrv/magehand"

[dependencies]
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
pdf-extract = "0.7"
tiny_http = "0.12"
qrcode = "0.14"
